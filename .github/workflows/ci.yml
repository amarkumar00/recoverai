name: Credential-free verification

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_MODE: demo
      DATABASE_PATH: ${{ runner.temp }}/recoverai-ci.db
      CI: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Use Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify documentation links and evidence locks
        run: npm run docs:check

      - name: Verify formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Strict type-check
        run: npm run typecheck

      - name: Verify migrations and fresh database integrity
        run: npm run db:check

      - name: Verify locked dataset and golden report integrity
        run: npm run integrity:check

      - name: Run complete deterministic suite
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Audit production dependency severity
        run: npm run audit:dependencies

      - name: Check repository and generated artifacts
        run: npm run hygiene:check

      - name: Run credential-free production HTTP smoke
        run: npm run smoke:production
